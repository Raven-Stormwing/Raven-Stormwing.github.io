<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dreamcaster Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
  body {
    margin: 0;
    background: #000;
    color: #eee;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
  }

 .hero-video {
  position: relative;
  height: 70vh;
  min-height: 420px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-video video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-video::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
}

.hero-overlay {
  position: relative;
  z-index: 2;
  padding: 2rem;
}

.hero-overlay img {
  max-width: min(520px, 80vw);
}

.hero-overlay h1 {
  font-size: clamp(2.4rem, 7vw, 5rem);
  margin: 1rem 0 0.5rem;
  color: #f6c26b;
}

.hero-buttons {
  margin-top: 1.5rem;
}

.hero-buttons a {
  display: inline-block;
  margin: 0.4rem;
  padding: 0.8rem 1.2rem;
  border: 1px solid #f6c26b;
  border-radius: 999px;
}

.feature {
  background: #080808;
}

  .hero img {
    max-width: min(750px, 88vw);
    height: auto;
    display: block;
  }

  .content {
    padding: 2.5rem 1rem 4rem;
    font-size: 1.1rem;
  }

  .content h2 {
    margin-top: 2rem;
  }

  a,
  a:link,
  a:visited {
    color: #f6c26b;
    text-decoration: none;
    font-weight: 600;
  }

  a:hover,
  a:focus {
    color: #ffd27d;
    text-decoration: underline;
  }

  a:active {
    color: #ffe7a3;
  }
</style>

</head>

<body>

 <section class="hero">
  <div class="hero-inner">
    <img src="logo.png" alt="Dreamcaster">
    <div class="subtitle">Productions</div>
  </div>
</section>

   <section class="content">
    <p>Stories. Music. Worlds Beyond.</p>
    
    <h2>Gallery</h2>
<p><a href="gallery/">Artwork & Concepts</a></p>

    <h2>Portfolios</h2>
    <p><a href="raven-stormwing/">Raven Stormwing</a></p>
  </section>

</body>
</html>
