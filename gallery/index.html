<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamcaster Gallery</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }

    a {
      color: #f6c26b;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      color: #ffd27d;
      text-decoration: underline;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .hint {
      opacity: 0.7;
      font-size: 0.95rem;
      text-align: center;
      margin-top: 0.5rem;
    }

    .filters {
      text-align: center;
      margin: 1.5rem 0 2rem;
    }

    .filters button {
      margin: 0.35rem;
      padding: 0.7rem 1.1rem;
      border: 1px solid #f6c26b;
      border-radius: 999px;
      background: rgba(246, 194, 107, 0.08);
      color: #f6c26b;
      font-weight: 600;
      cursor: pointer;
    }

    .filters button:hover,
    .filters button.active {
      background: rgba(246, 194, 107, 0.2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .tile {
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      transition: transform .15s ease;
    }

    .tile:hover img {
      transform: scale(1.03);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 999;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>

  <header class="wrap">
    <h1>Dreamcaster Gallery</h1>
    <p class="hint">Click an image to view larger. Press Esc to close.</p>
    <p><a href="../">← Back to Dreamcaster Productions</a></p>
  </header>

  <main class="wrap">
    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="characters">Characters</button>
      <button data-filter="newsletters">Newsletters</button>
      <button data-filter="covers">Covers</button>
      <button data-filter="locations">Locations</button>
      <button data-filter="promo">Promo</button>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <img id="lightboxImg" alt="Gallery image" />
  </div>

  <script>
    let galleryFiles = [];

    async function loadGallery() {
      const res = await fetch("./gallery.json");
      galleryFiles = await res.json();
      renderGallery("all");
    }

    function renderGallery(filter) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const filteredFiles = filter === "all"
        ? galleryFiles
        : galleryFiles.filter(file => file.startsWith(filter + "/"));

      filteredFiles.forEach(file => {
        const tile = document.createElement("a");
        tile.href = "./images/" + file;
        tile.className = "tile";
        tile.innerHTML = `<img src="./images/${file}" loading="lazy" alt="">`;

        tile.addEventListener("click", (e) => {
          e.preventDefault();
          openLightbox(tile.href);
        });

        grid.appendChild(tile);
      });
    }

    document.querySelectorAll(".filters button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filters button").forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");
        renderGallery(button.dataset.filter);
      });
    });

    function openLightbox(src) {
      const lb = document.getElementById("lightbox");
      const img = document.getElementById("lightboxImg");
      img.src = src;
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      const lb = document.getElementById("lightbox");
      const img = document.getElementById("lightboxImg");
      img.src = "";
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden", "true");
    }

    document.getElementById("lightbox").addEventListener("click", closeLightbox);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    loadGallery();
  </script>

</body>
</html>
